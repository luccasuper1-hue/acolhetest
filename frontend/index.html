    <title>Acolhe — Um primeiro passo para cuidar de você</title>
    <style>
      /* Fallback imediato enquanto o app carrega: evita uma tela vazia em
         conexões móveis lentas ou quando o navegador restaura uma aba. */
      .boot-screen { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #17111f; color: #f7f3fb; font: 600 15px/1.4 "DM Sans", system-ui, sans-serif; text-align: center; }
      .boot-screen__inner { display: grid; justify-items: center; gap: 14px; }
      .boot-screen__mark { width: 42px; height: 42px; border: 3px solid rgba(191,164,242,.28); border-top-color: #9b63e8; border-radius: 50%; animation: acolhe-boot-spin .8s linear infinite; }
      .boot-screen__label { margin: 0; color: #c8b9d8; }
      @keyframes acolhe-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-screen__mark { animation: none; } }
    </style>
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para usar o Acolhe.</noscript>
    <div id="root"><div class="boot-screen" role="status" aria-live="polite"><div class="boot-screen__inner"><span class="boot-screen__mark" aria-hidden="true"></span><p class="boot-screen__label">Abrindo o Acolhe…</p></div></div></div>
    <script type="module" src="/src/index.js"></script>
  </body>
