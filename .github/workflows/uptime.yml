name: Acolhe uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: acolhe-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ACOLHE_BASE_URL: ${{ vars.ACOLHE_BASE_URL }}
    steps:
      - name: Check home and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACOLHE_BASE_URL:-}" || { echo "ACOLHE_BASE_URL is not configured" >&2; exit 1; }
          base="$ACOLHE_BASE_URL"
          base="${base%/}"
          curl --fail --silent --show-error --location --max-time 20 "$base/" >/dev/null
          health="$(curl --fail --silent --show-error --location --max-time 20 "$base/api/health")"
          echo "$health" | grep -q '"ok":true'
